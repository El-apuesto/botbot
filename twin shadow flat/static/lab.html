<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Twin Shadow — Video Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:      #cc00ff;
      --purple-dim:  #7700aa;
      --purple-dark: #1a0033;
      --green:       #00ff88;
      --green-dim:   #007744;
      --glow:        0 0 6px #cc00ff, 0 0 14px #cc00ff;
      --glow-g:      0 0 6px #00ff88, 0 0 14px #00ff88;
      --font:        'Press Start 2P', monospace;
      --white:       #ffffff;
    }

    html, body { width: 100%; height: 100%; overflow: hidden;
      background: #000; font-family: var(--font); color: var(--white); }

    #app { position: fixed; inset: 0;
      background-image: url('/static/mobile_bg.jpg');
      background-size: cover; background-position: center top; background-repeat: no-repeat; }
    @media (orientation: landscape) and (min-width: 700px) {
      #app { background-image: url('/static/desk_bg.jpg'); background-position: left center; }
    }

    /* ── LAB PANEL (same position as chat panel) ── */
    #lab-panel {
      position: absolute; display: flex; flex-direction: column;
      top: 44%; left: 3%; right: 3%; bottom: 20%;
      background: rgba(6, 0, 18, 0.5); overflow: hidden;
    }
    @media (orientation: landscape) and (min-width: 700px) {
      #lab-panel { top: 34%; left: 37%; right: 1%; bottom: 14%; }
    }

    /* ── TOP STRIP ── */
    #lab-strip {
      display: flex; align-items: center; justify-content: space-between;
      padding: 3px 8px; border-bottom: 1px solid var(--purple-dim);
      background: rgba(6,0,18,.75); flex-shrink: 0; min-height: 22px; gap: 6px;
    }
    #lab-title { font-size: 6px; color: var(--green); text-shadow: var(--glow-g); letter-spacing: 1px; }
    #lab-status { font-size: 5px; color: var(--purple-dim); flex: 1; text-align: center; overflow: hidden;
      white-space: nowrap; text-overflow: ellipsis; }
    #lab-back { font-size: 5px; color: var(--purple); text-decoration: none;
      border: 1px solid var(--purple-dim); padding: 2px 5px; flex-shrink: 0; }
    #lab-back:hover { box-shadow: var(--glow); }

    /* ── OUTPUT AREA ── */
    #lab-output {
      flex: 1; overflow-y: auto; padding: 6px 8px 4px;
      display: flex; flex-direction: column; gap: 6px;
      scrollbar-width: thin; scrollbar-color: var(--purple-dim) transparent; }
    #lab-output::-webkit-scrollbar { width: 3px; }
    #lab-output::-webkit-scrollbar-thumb { background: var(--purple-dim); }

    /* log lines */
    .log-line { font-size: 6px; color: var(--white); line-height: 2; white-space: pre-wrap; word-break: break-word; }
    .log-line.ok  { color: var(--green); }
    .log-line.err { color: #ff4466; }
    .log-line.dim { color: var(--purple-dim); }
    .log-line.hdr { color: var(--purple); text-shadow: var(--glow); }

    /* scene cards */
    .scene-card {
      border: 1px solid var(--purple-dim); padding: 5px 7px;
      display: flex; flex-direction: column; gap: 3px; }
    .scene-num { font-size: 5px; color: var(--purple); }
    .scene-desc { font-size: 6px; color: var(--white); line-height: 1.8; }
    .scene-vo { font-size: 5px; color: var(--purple-dim); font-style: italic; }
    .scene-img { max-width: 100%; max-height: 80px; object-fit: cover;
      border: 1px solid var(--purple-dim); margin-top: 3px; cursor: pointer; }
    .scene-img:hover { border-color: var(--purple); }

    /* step tracker */
    .step-row { display: flex; align-items: center; gap: 6px; }
    .step-icon { font-size: 8px; width: 14px; flex-shrink: 0; }
    .step-lbl  { font-size: 6px; color: var(--white); }
    .step-row.pending .step-icon { color: var(--purple-dim); }
    .step-row.active  .step-icon { color: var(--green); }
    .step-row.done    .step-icon { color: var(--green); }
    .step-row.error   .step-icon { color: #ff4466; }

    /* ── ACTIONS ROW ── */
    #lab-actions {
      display: flex; gap: 4px; padding: 3px 6px; flex-shrink: 0;
      border-top: 1px solid var(--purple-dim); overflow-x: auto;
      background: rgba(6,0,18,.6); scrollbar-width: none; }
    #lab-actions::-webkit-scrollbar { display: none; }
    .act-btn {
      flex-shrink: 0; background: var(--purple-dark); border: 1px solid var(--purple-dim);
      color: var(--purple-dim); font-family: var(--font); font-size: 5px;
      padding: 4px 7px; cursor: pointer; white-space: nowrap; transition: all .12s; }
    .act-btn:hover { border-color: var(--purple); color: var(--purple); box-shadow: var(--glow); }
    .act-btn.active { border-color: var(--green); color: var(--green); box-shadow: var(--glow-g); }
    .act-btn:disabled { opacity: .35; cursor: not-allowed; }

    /* ── INPUT ROW ── */
    #lab-input-row {
      display: flex; align-items: flex-end; gap: 5px;
      padding: 5px 7px; border-top: 1px solid var(--purple);
      background: rgba(6,0,18,.8); flex-shrink: 0; }
    #lab-upload-btn {
      flex-shrink: 0; background: transparent; border: 1px solid var(--purple-dim);
      color: var(--purple); font-size: 13px; width: 26px; height: 26px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #lab-upload-btn:hover { box-shadow: var(--glow); }
    #lab-file-input { display: none; }
    #lab-file-hint {
      display: none; font-size: 5px; color: var(--purple);
      padding: 2px 8px; background: rgba(6,0,18,.85);
      border-top: 1px solid var(--purple-dim); flex-shrink: 0; }
    #lab-concept {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--white); font-family: var(--font); font-size: 7px; line-height: 1.8;
      resize: none; min-height: 26px; max-height: 80px; overflow-y: auto;
      caret-color: var(--purple); caret-shape: block;
      padding: 2px 0; scrollbar-width: none; }
    #lab-concept::-webkit-scrollbar { display: none; }
    #lab-go-btn {
      flex-shrink: 0; width: 34px; height: 34px; padding: 0;
      border: 1px solid var(--purple); background: #060012;
      cursor: pointer; color: var(--purple); font-size: 14px;
      font-family: var(--font); transition: box-shadow .15s; }
    #lab-go-btn:hover { box-shadow: var(--glow); }

    /* ── OVERLAY PANELS ── */
    .panel { display: none; position: fixed; inset: 0;
      background: rgba(4,0,16,.96); z-index: 200; flex-direction: column;
      align-items: center; padding: 20px 14px 16px; overflow-y: auto; }
    .panel.open { display: flex; }
    .panel::-webkit-scrollbar { width: 4px; }
    .panel::-webkit-scrollbar-thumb { background: var(--purple-dim); }
    .ph { width: 100%; max-width: 700px; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--purple); padding-bottom: 8px; margin-bottom: 14px; }
    .pt { font-size: 9px; color: var(--purple); text-shadow: var(--glow); letter-spacing: 2px; }
    .pc { background: transparent; border: 1px solid var(--purple);
      color: var(--purple); font-family: var(--font); font-size: 7px;
      padding: 5px 9px; cursor: pointer; }
    .pc:hover { box-shadow: var(--glow); }
    .pb { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 14px; }
    .fg { display: flex; flex-direction: column; gap: 6px; }
    .fl { font-size: 6px; color: var(--purple); letter-spacing: 1px; }
    .fi { background: #060012; border: 1px solid var(--purple-dim);
      color: var(--white); font-family: var(--font); font-size: 7px;
      padding: 7px; outline: none; width: 100%; }
    .fi:focus { border-color: var(--purple); box-shadow: var(--glow); }
    .btn { align-self: flex-start; background: var(--purple-dark); border: 2px solid var(--purple);
      color: var(--purple); font-family: var(--font); font-size: 7px;
      padding: 8px 14px; cursor: pointer; letter-spacing: 1px; text-shadow: var(--glow); }
    .btn:hover { box-shadow: var(--glow); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* music track rows */
    .track-row { display: flex; justify-content: space-between; align-items: center;
      border: 1px solid var(--purple-dim); padding: 6px 10px; gap: 8px; }
    .track-name { font-size: 6px; color: var(--white); flex: 1; }
    .track-tags { font-size: 5px; color: var(--purple-dim); }
    .track-use  { background: transparent; border: 1px solid var(--purple-dim);
      color: var(--purple-dim); font-family: var(--font); font-size: 5px;
      padding: 3px 6px; cursor: pointer; }
    .track-use:hover { border-color: var(--purple); color: var(--purple); }
    .track-use.on { border-color: var(--green); color: var(--green); }

    /* uploaded files list */
    .upl-row { display: flex; justify-content: space-between; align-items: center;
      border: 1px solid var(--purple-dim); padding: 4px 8px; gap: 6px; }
    .upl-name  { font-size: 6px; color: var(--white); flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .upl-type  { font-size: 5px; color: var(--purple-dim); flex-shrink: 0; }

    /* video player */
    video { width: 100%; max-height: 360px; background: #000;
      border: 1px solid var(--purple); margin-top: 8px; }
    .dl-link { font-family: var(--font); font-size: 7px; color: var(--purple);
      text-decoration: none; border: 1px solid var(--purple); padding: 8px 14px;
      align-self: flex-start; }
    .dl-link:hover { box-shadow: var(--glow); }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .blink { animation: blink .7s step-end infinite; }
  </style>
</head>
<body>
<div id="app">

  <!-- ═══ LAB PANEL ═══ -->
  <div id="lab-panel">

    <!-- Top strip -->
    <div id="lab-strip">
      <span id="lab-title">▶ VIDEO LAB</span>
      <span id="lab-status">READY</span>
      <a href="/" id="lab-back">← MAIN</a>
    </div>

    <!-- File hint -->
    <div id="lab-file-hint"></div>

    <!-- Output / log area -->
    <div id="lab-output">
      <div class="log-line dim">TWIN SHADOW — VIDEO LAB v1.0</div>
      <div class="log-line dim">DESCRIBE A CONCEPT → STORYBOARD → GENERATE → RENDER</div>
    </div>

    <!-- Action buttons -->
    <div id="lab-actions">
      <button class="act-btn" id="btn-storyboard" onclick="doStoryboard()" title="Generate storyboard from concept">[ STORYBOARD ]</button>
      <button class="act-btn" id="btn-images"     onclick="doImages()"     title="Generate scene images via FAL">[ IMAGES ]</button>
      <button class="act-btn" id="btn-video"      onclick="doVideo()"      title="Generate AI video clip">[ VIDEO ]</button>
      <button class="act-btn" id="btn-voice"      onclick="doVoice()"      title="Generate voiceover from storyboard">[ VOICEOVER ]</button>
      <button class="act-btn" id="btn-render"     onclick="doRender()"     title="Assemble final video with FFMPEG">[ RENDER ]</button>
      <button class="act-btn" id="btn-music"      onclick="openMusic()"    title="Manage music library">[ MUSIC ]</button>
      <button class="act-btn" id="btn-uploads"    onclick="openUploads()"  title="View uploaded files">[ FILES ]</button>
    </div>

    <!-- Input row -->
    <div id="lab-input-row">
      <button id="lab-upload-btn" onclick="document.getElementById('lab-file-input').click()" title="Upload file">&#128206;</button>
      <input id="lab-file-input" type="file" accept="video/*,audio/*,image/*" multiple onchange="onLabFile(this)">
      <textarea id="lab-concept" rows="1" placeholder="Describe your video concept..." oninput="labResize(this)" onkeydown="labKey(event)"></textarea>
      <button id="lab-go-btn" onclick="doStoryboard()" title="Generate storyboard">&#9654;</button>
    </div>
  </div>

  <!-- ═══ MUSIC PANEL ═══ -->
  <div class="panel" id="panel-music">
    <div class="ph">
      <span class="pt">[ MUSIC LIBRARY ]</span>
      <button class="pc" onclick="closePanel('music')">X CLOSE</button>
    </div>
    <div class="pb">
      <div class="fg">
        <span class="fl">UPLOAD TRACK</span>
        <input class="fi" type="file" id="music-file-input" accept="audio/*">
        <input class="fi" id="music-tags" type="text" placeholder="Tags: dark, ambient, upbeat...">
        <button class="btn" onclick="uploadMusicTrack()">[ UPLOAD TRACK ]</button>
      </div>
      <div class="fg">
        <span class="fl">LIBRARY</span>
        <div id="music-list" style="display:flex;flex-direction:column;gap:5px;"></div>
        <p id="music-empty" style="font-size:6px;color:var(--purple-dim);">NO TRACKS. UPLOAD ONE ABOVE.</p>
      </div>
    </div>
  </div>

  <!-- ═══ UPLOADS PANEL ═══ -->
  <div class="panel" id="panel-uploads">
    <div class="ph">
      <span class="pt">[ UPLOADED FILES ]</span>
      <button class="pc" onclick="closePanel('uploads')">X CLOSE</button>
    </div>
    <div class="pb">
      <div id="uploads-list" style="display:flex;flex-direction:column;gap:5px;"></div>
      <p id="uploads-empty" style="font-size:6px;color:var(--purple-dim);">NO FILES UPLOADED YET.</p>
    </div>
  </div>

  <!-- ═══ VIDEO PREVIEW PANEL ═══ -->
  <div class="panel" id="panel-preview">
    <div class="ph">
      <span class="pt">[ RENDERED VIDEO ]</span>
      <button class="pc" onclick="closePanel('preview')">X CLOSE</button>
    </div>
    <div class="pb">
      <video id="preview-video" controls></video>
      <a id="preview-dl" class="dl-link" download="twin_shadow_video.mp4" style="display:none">[ DOWNLOAD MP4 ]</a>
    </div>
  </div>

</div><!-- #app -->

<script>
/* ─────────────────────────────────────────
   STATE
───────────────────────────────────────── */
const S = {
  get(k, d) { try { const v = localStorage.getItem('lab_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('lab_' + k, JSON.stringify(v)); } catch {} },
};

let labState = {
  concept:     '',
  storyboard:  null,   // [{id, description, duration, voiceover, style}]
  images:      {},     // scene_id → {url, local_path}
  clips:       [],     // [{path, scene_id}]
  voiceUrl:    null,
  voicePath:   null,
  musicPath:   null,
  renderUrl:   null,
  videoJobId:  null,
  uploadedFiles: [],
};

let _pollTimer = null;

/* ─────────────────────────────────────────
   BOOT
───────────────────────────────────────── */
(async function boot() {
  labResize(document.getElementById('lab-concept'));
  await checkConcept();
})();

/* ─────────────────────────────────────────
   CONCEPT BRIDGE (from boardroom/builder)
───────────────────────────────────────── */
async function checkConcept() {
  try {
    const res = await fetch('/api/lab/concept');
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.concept) {
      document.getElementById('lab-concept').value = data.concept;
      labResize(document.getElementById('lab-concept'));
      setStatus('CONCEPT LOADED FROM BOARD');
      log('hdr', '> CONCEPT RECEIVED FROM BOARDROOM/BUILDER:');
      log('ok', data.concept.slice(0, 200));
      if (data.script) {
        labState.storyboard = null;
        log('dim', '[SCRIPT ATTACHED — USE VOICEOVER TO RENDER]');
      }
    }
  } catch {}
}

/* ─────────────────────────────────────────
   UI HELPERS
───────────────────────────────────────── */
function setStatus(txt) {
  document.getElementById('lab-status').textContent = txt;
}

function log(cls, text) {
  const out = document.getElementById('lab-output');
  const d = document.createElement('div');
  d.className = 'log-line ' + cls;
  d.textContent = text;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
  return d;
}

function logStep(id, icon, label, cls) {
  const out = document.getElementById('lab-output');
  let row = document.getElementById('step-' + id);
  if (!row) {
    row = document.createElement('div');
    row.id = 'step-' + id;
    row.className = 'step-row ' + cls;
    row.innerHTML = `<span class="step-icon">${icon}</span><span class="step-lbl">${label}</span>`;
    out.appendChild(row);
  } else {
    row.className = 'step-row ' + cls;
    row.querySelector('.step-icon').textContent = icon;
    row.querySelector('.step-lbl').textContent = label;
  }
  out.scrollTop = out.scrollHeight;
}

function clearOutput() {
  document.getElementById('lab-output').innerHTML = '';
}

function labResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

function labKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doStoryboard(); }
}

function setBusy(id, busy, label) {
  const b = document.getElementById('btn-' + id);
  if (!b) return;
  b.disabled = busy;
  b.classList.toggle('active', busy);
  if (label) b.textContent = label;
}

/* ─────────────────────────────────────────
   FILE UPLOAD
───────────────────────────────────────── */
function onLabFile(inp) {
  if (!inp.files.length) return;
  const hint = document.getElementById('lab-file-hint');
  const names = Array.from(inp.files).map(f => f.name).join(', ');
  hint.textContent = '> ' + names;
  hint.style.display = 'block';
  uploadFiles(inp.files);
}

async function uploadFiles(files) {
  for (const file of Array.from(files)) {
    const fd = new FormData();
    fd.append('file', file);
    log('dim', `> UPLOADING ${file.name}...`);
    try {
      const res = await fetch('/api/lab/upload', { method: 'POST', body: fd });
      const data = await res.json();
      if (data.ok) {
        labState.uploadedFiles.push(data);
        if (data.file_type === 'video') labState.clips.push({ path: data.path, name: data.name });
        log('ok', `✓ ${data.name} (${data.file_type}${data.duration ? ', ' + data.duration.toFixed(1) + 's' : ''})`);
      } else {
        log('err', `✗ UPLOAD FAILED: ${data.error || 'unknown'}`);
      }
    } catch(e) {
      log('err', `✗ UPLOAD ERROR: ${e}`);
    }
  }
  document.getElementById('lab-file-hint').style.display = 'none';
  document.getElementById('lab-file-input').value = '';
}

/* ─────────────────────────────────────────
   STORYBOARD
───────────────────────────────────────── */
async function doStoryboard() {
  const concept = document.getElementById('lab-concept').value.trim();
  if (!concept) { log('err', '> NO CONCEPT ENTERED'); return; }
  labState.concept = concept;
  clearOutput();
  log('hdr', '> GENERATING STORYBOARD...');
  setBusy('storyboard', true, '[ THINKING... ]');
  setStatus('STORYBOARD IN PROGRESS');

  try {
    const res = await fetch('/api/lab/storyboard', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ concept }),
    });
    const data = await res.json();
    if (data.error) { log('err', '✗ ' + data.error); return; }

    labState.storyboard = data.scenes;
    log('ok', `✓ STORYBOARD: ${data.scenes.length} SCENES`);
    log('', '');

    const out = document.getElementById('lab-output');
    data.scenes.forEach((sc, i) => {
      const card = document.createElement('div');
      card.className = 'scene-card';
      card.id = 'scene-card-' + sc.id;
      card.innerHTML =
        `<div class="scene-num">SCENE ${i + 1} · ${sc.duration || 5}s · ${sc.style || 'cinematic'}</div>` +
        `<div class="scene-desc">${esc(sc.description)}</div>` +
        (sc.voiceover ? `<div class="scene-vo">"${esc(sc.voiceover)}"</div>` : '');
      out.appendChild(card);
    });
    out.scrollTop = out.scrollHeight;

    log('', '');
    log('dim', '> NEXT: [ IMAGES ] to generate visuals, [ VOICEOVER ] for audio');
    setStatus(`STORYBOARD READY — ${data.scenes.length} SCENES`);
  } catch(e) {
    log('err', '✗ STORYBOARD ERROR: ' + e);
  } finally {
    setBusy('storyboard', false, '[ STORYBOARD ]');
  }
}

/* ─────────────────────────────────────────
   IMAGE GENERATION
───────────────────────────────────────── */
async function doImages() {
  if (!labState.storyboard?.length) { log('err', '> RUN STORYBOARD FIRST'); return; }
  setBusy('images', true, '[ GENERATING... ]');
  setStatus('GENERATING IMAGES');
  log('hdr', `> GENERATING ${labState.storyboard.length} SCENE IMAGES VIA FAL...`);

  for (let i = 0; i < labState.storyboard.length; i++) {
    const sc = labState.storyboard[i];
    log('dim', `  SCENE ${i + 1}: ${sc.description.slice(0, 60)}...`);
    logStep('img-' + sc.id, '⟳', `SCENE ${i+1} — GENERATING`, 'active');

    const body = {
      description: sc.description,
      style: sc.style || 'cinematic dark occult',
      scene_id: sc.id,
    };
    const lastClip = labState.clips[labState.clips.length - 1];
    if (lastClip) body.reference_clip = lastClip.path;

    try {
      const res = await fetch('/api/lab/image', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.error) {
        logStep('img-' + sc.id, '✗', `SCENE ${i+1} — FAILED: ${data.error}`, 'error');
        continue;
      }
      labState.images[sc.id] = data;
      logStep('img-' + sc.id, '✓', `SCENE ${i+1} — DONE`, 'done');

      const card = document.getElementById('scene-card-' + sc.id);
      if (card && data.url) {
        const img = document.createElement('img');
        img.className = 'scene-img';
        img.src = data.url;
        img.title = 'Click to use as reference';
        img.onclick = () => log('ok', `> REFERENCE SET: scene ${i+1}`);
        card.appendChild(img);
      }
    } catch(e) {
      logStep('img-' + sc.id, '✗', `SCENE ${i+1} — ERROR: ${e}`, 'error');
    }
  }

  log('ok', '✓ IMAGE GENERATION COMPLETE');
  setStatus('IMAGES DONE');
  setBusy('images', false, '[ IMAGES ]');
}

/* ─────────────────────────────────────────
   VIDEO GENERATION
───────────────────────────────────────── */
async function doVideo() {
  const concept = labState.concept || document.getElementById('lab-concept').value.trim();
  if (!concept) { log('err', '> NEED A CONCEPT FIRST'); return; }

  setBusy('video', true, '[ SUBMITTING... ]');
  setStatus('SUBMITTING VIDEO JOB');
  log('hdr', '> SUBMITTING AI VIDEO GENERATION JOB...');

  const prompt = labState.storyboard
    ? labState.storyboard.map(s => s.description).join('. ')
    : concept;

  const firstImage = labState.storyboard
    ? labState.images[labState.storyboard[0]?.id]
    : null;

  try {
    const res = await fetch('/api/lab/video/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, image_url: firstImage?.url }),
    });
    const data = await res.json();
    if (data.error) { log('err', '✗ ' + data.error); setBusy('video', false, '[ VIDEO ]'); return; }

    labState.videoJobId = data.job_id;
    log('ok', `✓ JOB SUBMITTED: ${data.job_id} (${data.provider})`);
    log('dim', '  POLLING FOR RESULT EVERY 8 SECONDS...');
    setStatus('VIDEO GENERATING...');
    logStep('video-job', '⟳', `${data.provider.toUpperCase()} JOB RUNNING...`, 'active');

    _pollTimer = setInterval(() => pollVideoJob(data.job_id), 8000);
    setBusy('video', false, '[ VIDEO ]');
  } catch(e) {
    log('err', '✗ VIDEO JOB ERROR: ' + e);
    setBusy('video', false, '[ VIDEO ]');
  }
}

async function pollVideoJob(jobId) {
  try {
    const res = await fetch('/api/lab/video/status/' + jobId);
    const data = await res.json();
    if (data.status === 'done') {
      clearInterval(_pollTimer);
      logStep('video-job', '✓', 'VIDEO GENERATION COMPLETE', 'done');
      log('ok', '✓ VIDEO URL: ' + data.url);
      setStatus('VIDEO READY');
      if (data.local_path) labState.clips.push({ path: data.local_path, name: 'ai_video.mp4' });
    } else if (data.status === 'error') {
      clearInterval(_pollTimer);
      logStep('video-job', '✗', 'VIDEO JOB FAILED: ' + (data.error || ''), 'error');
      setStatus('VIDEO FAILED');
    } else {
      logStep('video-job', '⟳', `JOB RUNNING (${data.status})...`, 'active');
    }
  } catch {}
}

/* ─────────────────────────────────────────
   VOICEOVER
───────────────────────────────────────── */
async function doVoice() {
  let script = '';
  if (labState.storyboard?.length) {
    script = labState.storyboard
      .filter(s => s.voiceover)
      .map(s => s.voiceover)
      .join(' ');
  }
  if (!script) script = labState.concept || document.getElementById('lab-concept').value.trim();
  if (!script) { log('err', '> NO SCRIPT. RUN STORYBOARD FIRST.'); return; }

  setBusy('voice', true, '[ RENDERING... ]');
  setStatus('VOICEOVER IN PROGRESS');
  logStep('voice-step', '⟳', 'RENDERING VOICEOVER...', 'active');

  try {
    const res = await fetch('/api/lab/voice', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: script }),
    });
    const data = await res.json();
    if (data.error) {
      logStep('voice-step', '✗', 'VOICEOVER FAILED: ' + data.error, 'error');
      return;
    }
    labState.voiceUrl  = data.url;
    labState.voicePath = data.path;
    logStep('voice-step', '✓', 'VOICEOVER READY', 'done');

    const out = document.getElementById('lab-output');
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px';
    const aud = document.createElement('audio');
    aud.controls = true; aud.src = data.url;
    aud.style.cssText = 'flex:1;min-width:120px;margin:0';
    const dl = document.createElement('a');
    dl.href = data.url; dl.download = 'voiceover.mp3';
    dl.textContent = '[ DL MP3 ]';
    dl.style.cssText = 'font-family:var(--font);font-size:5px;color:var(--purple);text-decoration:none;border:1px solid var(--purple);padding:5px 8px;white-space:nowrap';
    row.appendChild(aud); row.appendChild(dl);
    out.appendChild(row);
    out.scrollTop = out.scrollHeight;
    setStatus('VOICEOVER READY');
  } catch(e) {
    logStep('voice-step', '✗', 'VOICEOVER ERROR: ' + e, 'error');
  } finally {
    setBusy('voice', false, '[ VOICEOVER ]');
  }
}

/* ─────────────────────────────────────────
   RENDER
───────────────────────────────────────── */
async function doRender() {
  if (!labState.clips.length && !Object.keys(labState.images).length) {
    log('err', '> NO CLIPS OR IMAGES TO RENDER. GENERATE IMAGES OR UPLOAD VIDEO CLIPS FIRST.');
    return;
  }

  setBusy('render', true, '[ RENDERING... ]');
  setStatus('FFMPEG ASSEMBLY IN PROGRESS');
  log('hdr', '> STARTING FFMPEG ASSEMBLY...');

  const imagePaths = Object.values(labState.images)
    .filter(i => i.local_path)
    .map(i => i.local_path);

  const outputName = 'render_' + Date.now();

  const body = {
    clips:       labState.clips.map(c => c.path),
    image_paths: imagePaths,
    voiceover:   labState.voicePath || null,
    music:       labState.musicPath || null,
    transition:  'fade',
    output_name: outputName,
  };

  try {
    const res = await fetch('/api/lab/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) { log('err', '✗ RENDER HTTP ' + res.status); setBusy('render', false, '[ RENDER ]'); return; }

    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let   buf    = '';
    let   finalUrl = null;

    outer: while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data:')) continue;
        let d; try { d = JSON.parse(p.slice(5).trim()); } catch { continue; }
        if (d.done) break outer;
        if (d.error) { log('err', '✗ RENDER ERROR: ' + d.error); break outer; }
        if (d.text) {
          const line = d.text.trim();
          if (!line) continue;
          if (line.startsWith('DONE:')) {
            finalUrl = line.slice(5).trim();
          } else if (line.startsWith('✗')) {
            logStep('render-step', '✗', line, 'error');
          } else if (line.startsWith('✓')) {
            logStep('render-step', '✓', line, 'done');
          } else {
            logStep('render-step', '⟳', line, 'active');
          }
        }
      }
    }

    if (finalUrl) {
      labState.renderUrl = finalUrl;
      log('ok', '✓ RENDER COMPLETE');
      setStatus('RENDER COMPLETE');
      showPreview(finalUrl);
    } else {
      setStatus('RENDER DONE (check log)');
    }
  } catch(e) {
    log('err', '✗ RENDER ERROR: ' + e);
    setStatus('RENDER FAILED');
  } finally {
    setBusy('render', false, '[ RENDER ]');
  }
}

function showPreview(url) {
  const vid = document.getElementById('preview-video');
  vid.src = url;
  const dl = document.getElementById('preview-dl');
  dl.href = url; dl.style.display = '';
  openPanel('preview');
}

/* ─────────────────────────────────────────
   MUSIC LIBRARY
───────────────────────────────────────── */
async function loadMusic() {
  const list  = document.getElementById('music-list');
  const empty = document.getElementById('music-empty');
  try {
    const tracks = await fetch('/api/lab/music').then(r => r.json());
    list.innerHTML = '';
    empty.style.display = tracks.length ? 'none' : '';
    tracks.forEach(t => {
      const row = document.createElement('div');
      row.className = 'track-row';
      const isActive = labState.musicPath === t.path;
      row.innerHTML =
        `<span class="track-name">${esc(t.name)}</span>` +
        `<span class="track-tags">${esc(t.tags || '')}</span>` +
        `<button class="track-use ${isActive ? 'on' : ''}" onclick="selectMusic('${esc(t.path)}','${esc(t.name)}',this)">` +
          `${isActive ? '✓ SELECTED' : 'USE'}` +
        `</button>`;
      list.appendChild(row);
    });
  } catch(e) {
    list.innerHTML = `<div class="log-line err">ERROR: ${e}</div>`;
  }
}

function selectMusic(path, name, btn) {
  labState.musicPath = path;
  document.querySelectorAll('.track-use').forEach(b => { b.textContent = 'USE'; b.classList.remove('on'); });
  btn.textContent = '✓ SELECTED'; btn.classList.add('on');
  log('ok', `> MUSIC SELECTED: ${name}`);
}

async function uploadMusicTrack() {
  const fileInput = document.getElementById('music-file-input');
  const tags = document.getElementById('music-tags').value.trim();
  if (!fileInput.files.length) { alert('SELECT AN AUDIO FILE FIRST'); return; }
  const fd = new FormData();
  fd.append('file', fileInput.files[0]);
  if (tags) fd.append('tags', tags);
  try {
    const res = await fetch('/api/lab/music/add', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.ok) { fileInput.value = ''; document.getElementById('music-tags').value = ''; await loadMusic(); }
    else alert('UPLOAD FAILED: ' + (data.error || 'unknown'));
  } catch(e) { alert('ERROR: ' + e); }
}

/* ─────────────────────────────────────────
   UPLOADS PANEL
───────────────────────────────────────── */
async function openUploads() {
  openPanel('uploads');
  const list  = document.getElementById('uploads-list');
  const empty = document.getElementById('uploads-empty');
  list.innerHTML = '';
  if (!labState.uploadedFiles.length) { empty.style.display = ''; return; }
  empty.style.display = 'none';
  labState.uploadedFiles.forEach(f => {
    const row = document.createElement('div');
    row.className = 'upl-row';
    row.innerHTML = `<span class="upl-name">${esc(f.name)}</span><span class="upl-type">[${f.file_type}]</span>`;
    list.appendChild(row);
  });
}

/* ─────────────────────────────────────────
   PANELS
───────────────────────────────────────── */
function openPanel(name) {
  closeAll();
  const p = document.getElementById('panel-' + name);
  if (p) p.classList.add('open');
  if (name === 'music') loadMusic();
}
function closePanel(name) {
  document.getElementById('panel-' + name)?.classList.remove('open');
}
function closeAll() {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
}
function openMusic() { openPanel('music'); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAll();
});

/* ─────────────────────────────────────────
   UTIL
───────────────────────────────────────── */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
