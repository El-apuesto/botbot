<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Twin Shadow — Invite</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%; background: #000;
      font-family: 'VT323', monospace; cursor: crosshair; color: #cc44ff;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.09) 3px, rgba(0,0,0,0.09) 4px);
      pointer-events: none; z-index: 100;
    }
    .page {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; padding: 32px 24px;
      position: relative; z-index: 1; gap: 24px;
    }
    .title { font-size: 36px; letter-spacing: 6px; text-shadow: 0 0 16px #cc44ff; }
    .sub   { font-size: 20px; color: #9944bb; letter-spacing: 2px; text-align: center; }
    .box {
      width: 100%; max-width: 560px;
      border: 2px solid #9900cc; background: rgba(20,0,40,0.7);
      padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .link-text {
      font-size: 18px; color: #f2eaff; word-break: break-all;
      letter-spacing: 1px; padding: 8px 10px;
      border: 1px solid #440066; background: #0a000f;
      text-shadow: 0 0 6px #cc44ff;
    }
    .copy-btn {
      width: 100%; border: 2px solid #9900cc; background: rgba(60,0,100,0.25);
      color: #f2eaff; font-family: 'VT323', monospace; font-size: 26px;
      padding: 8px; cursor: pointer; letter-spacing: 5px;
      text-shadow: 0 0 10px #cc44ff; transition: background .15s, border-color .15s;
    }
    .copy-btn:hover { background: rgba(100,0,180,0.45); border-color: #cc44ff; }
    .copy-btn.copied { color: #44ffaa; border-color: #44ffaa; text-shadow: 0 0 10px #44ffaa; }
    .notice { font-size: 17px; color: #553377; letter-spacing: 1px; text-align: center; }
    .back { font-size: 20px; color: #9944bb; }
    .back a { color: #dd88ff; text-decoration: underline; }
    .back a:hover { color: #f2eaff; }
    @media (min-width: 700px) {
      body {
        background-image: url('/static/desk_bg_login.jpeg');
        background-size: cover; background-position: center;
      }
      .page { background: rgba(4,0,12,0.8); }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="title">INVITE LINK</div>
  <div class="sub">Share this link once. It expires after use.</div>
  <div class="box">
    <div class="link-text" id="link">{{ link }}</div>
    <button class="copy-btn" id="copyBtn" onclick="copyLink()">COPY LINK</button>
  </div>
  <div class="notice">&#9888; One-time use only — generate a new one for each person.</div>
  <div class="back"><a href="/admin/invite">Generate another</a> &nbsp;|&nbsp; <a href="/">Back to app</a></div>
</div>
<script>
function copyLink() {
  const text = document.getElementById('link').textContent.trim();
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'COPIED!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'COPY LINK'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
</body>
</html>
