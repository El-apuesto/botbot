<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Twin Shadow — Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #cc44ff;
      --purple-glow: rgba(180,60,255,0.55);
      --bg: #040008;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg) url('/static/desk_bg.jpg') no-repeat center center / cover;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      cursor: crosshair;
    }
    @media (max-width: 600px) {
      html, body { background-image: url('/static/mobile_bg.jpg'); background-position: top center; }
    }

    /* Scanlines */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.09) 3px, rgba(0,0,0,0.09) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    .box {
      position: relative;
      z-index: 2;
      border: 1px solid var(--purple);
      box-shadow: 0 0 28px var(--purple-glow), 0 0 60px rgba(140,0,220,0.2), inset 0 0 30px rgba(60,0,100,0.25);
      background: rgba(8,0,20,0.86);
      padding: 28px 28px 24px;
      width: min(380px, 88vw);
      display: flex; flex-direction: column; gap: 18px;
    }

    /* Logo image */
    .logo-wrap {
      display: flex; justify-content: center;
    }
    .logo-wrap img {
      width: 120px; height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 0 16px var(--purple)) brightness(1.1);
    }

    /* Titlebar strip */
    .titlebar {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--purple);
      padding-bottom: 8px;
      color: #f2eaff;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-shadow: 0 0 8px var(--purple);
    }
    .titlebar-right { color: var(--purple); font-size: 10px; }

    .sub { color: rgba(200,160,255,0.45); font-size: 10px; line-height: 1.7; letter-spacing: 0.08em; }

    input {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--purple);
      color: #f2eaff;
      font-family: inherit; font-size: 14px;
      padding: 9px 12px;
      width: 100%; outline: none;
      letter-spacing: 2px;
      caret-color: var(--purple);
      transition: box-shadow .15s;
    }
    input::placeholder { color: rgba(150,80,200,0.5); letter-spacing: 1px; }
    input:focus { box-shadow: 0 0 12px var(--purple-glow); border-color: #ee88ff; }

    button {
      background: rgba(80,0,140,0.7);
      color: #f2eaff;
      border: 1px solid var(--purple);
      font-family: inherit; font-size: 11px;
      padding: 10px;
      cursor: pointer; width: 100%;
      letter-spacing: 2px;
      transition: background .15s, box-shadow .15s;
      text-shadow: 0 0 6px var(--purple);
    }
    button:hover {
      background: rgba(120,0,200,0.85);
      box-shadow: 0 0 16px var(--purple-glow);
    }

    .err { color: #ff44aa; font-size: 10px; text-align: center; letter-spacing: 0.08em; }

    /* Blinking cursor on prompt line */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .prompt { color: var(--purple); font-size: 11px; letter-spacing: 0.12em; }
    .prompt::after { content: '█'; animation: blink .7s step-end infinite; margin-left: 3px; }
  </style>
</head>
<body>
<div class="box">
  <div class="logo-wrap">
    <img src="/static/send_btn.jpg" alt="Twin Shadow">
  </div>
  <div class="titlebar">
    <span>/TWINSHADOW/AUTH.EXE</span>
    <span class="titlebar-right">v2.0</span>
  </div>
  <div class="sub">RESTRICTED SYSTEM. AUTHORISED USERS ONLY.</div>
  <form method="POST" action="/login" style="display:flex;flex-direction:column;gap:12px">
    <input type="password" name="password" placeholder="ENTER ACCESS CODE" autofocus autocomplete="current-password">
    {% if error %}
    <div class="err">&#9888; {{ error }}</div>
    {% endif %}
    <button type="submit">[ AUTHENTICATE ]</button>
  </form>
  <div class="prompt">AWAITING INPUT</div>
</div>
</body>
</html>
