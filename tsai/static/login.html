<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Twin Shadow — Access</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: 'VT323', monospace;
      cursor: crosshair;
      color: #00cccc;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.09) 3px, rgba(0,0,0,0.09) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 24px 24px;
      position: relative;
      z-index: 1;
    }

    /* LOGO */
    .logo-wrap {
      width: 100%;
      max-width: 420px;
      padding: 16px 0 0;
      display: flex;
      justify-content: center;
    }
    .logo-wrap img {
      width: 80%;
      max-width: 320px;
      height: auto;
      filter: drop-shadow(0 0 16px #00cccc) drop-shadow(0 0 32px #006655) brightness(3) contrast(1.2);
    }

    /* FIGURE — full composition */
    .figure-wrap {
      width: 100%;
      max-width: 460px;
      height: min(48vh, 360px);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .figure-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      filter: brightness(1.1) saturate(1.1);
    }

    /* FORM */
    .form-area {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    /* Input field rows — matching reference exactly */
    .field-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border: 2px solid #008888;
      background: #000;
      overflow: hidden;
    }
    .field-wrap:focus-within {
      border-color: #00cccc;
      box-shadow: 0 0 12px rgba(0,200,200,0.4);
    }

    .field-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #00cccc;
      font-family: 'VT323', monospace;
      font-size: 26px;
      padding: 10px 14px;
      letter-spacing: 2px;
      caret-color: #00cccc;
      width: 100%;
    }
    .field-input::placeholder {
      color: #00cccc;
      opacity: 1;
      text-shadow: 0 0 6px #008888;
    }

    /* DOS blinking cursor on focus+empty */
    @keyframes blink-cur { 0%,100%{opacity:1} 50%{opacity:0} }
    .field-cursor {
      display: none;
      color: #ccffee;
      font-size: 24px;
      animation: blink-cur 0.65s step-end infinite;
      padding-right: 10px;
      flex-shrink: 0;
      text-shadow: 0 0 8px #00cccc;
    }
    .field-input:focus:placeholder-shown ~ .field-cursor { display: inline; }
    .field-input:focus:placeholder-shown { caret-color: transparent; }
    .field-input:focus::placeholder { color: transparent; }

    /* USERNAME row — cosmetic prefix + input */
    .field-prefix {
      color: #00cccc;
      font-size: 26px;
      padding: 10px 4px 10px 14px;
      flex-shrink: 0;
      letter-spacing: 2px;
      text-shadow: 0 0 6px #008888;
      white-space: nowrap;
    }

    /* LOGIN button */
    .login-btn {
      width: 100%;
      border: 2px solid #008888;
      background: rgba(0,30,30,0.25);
      color: #ccffee;
      font-family: 'VT323', monospace;
      font-size: 30px;
      padding: 10px;
      cursor: pointer;
      letter-spacing: 6px;
      text-shadow: 0 0 12px #00cccc;
      box-shadow: 0 0 14px rgba(0,200,200,0.25);
      transition: background .15s, box-shadow .15s, border-color .15s;
    }
    .login-btn:hover {
      background: rgba(0,80,80,0.45);
      border-color: #00cccc;
      box-shadow: 0 0 28px rgba(0,200,200,0.55);
    }

    .err-msg {
      color: #ff4444;
      font-size: 20px;
      letter-spacing: 1px;
      text-align: center;
    }

    /* EXTRAS */
    .extras {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      max-width: 380px;
      font-size: 20px;
      color: #006655;
      margin-top: 6px;
    }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .remember-row input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: #00cccc;
      cursor: pointer;
      flex-shrink: 0;
    }
    .forgot-row { font-size: 20px; color: #006655; }
    .forgot-row a {
      color: #00ffaa;
      text-decoration: underline;
      cursor: pointer;
    }
    .forgot-row a:hover { color: #ccffee; }

    /* FOOTER */
    .footer {
      margin-top: auto;
      padding: 16px 0 0;
      width: 100%;
      max-width: 460px;
      text-align: center;
      font-size: 15px;
      color: #006655;
      border-top: 1px solid #003333;
    }
    .footer a { color: #006655; text-decoration: none; }
    .footer a:hover { color: #00cccc; }

    /* ── DESKTOP ── */
    @media (min-width: 700px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background-image: url('/static/desk_bg_login.jpeg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
      }
      .page {
        flex-direction: row;
        align-items: stretch;
        justify-content: flex-end;
        min-height: 100vh;
        padding: 0;
      }
      /* Left half is the background image — nothing rendered there */
      .figure-wrap { display: none; }
      .logo-wrap   { display: none; }
      /* Right column: form + footer stacked */
      .form-col {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 46%;
        min-height: 100vh;
        padding: 40px 48px;
        background: rgba(0,8,8,0.88);
        backdrop-filter: blur(2px);
        border-left: 1px solid #008888;
      }
      .form-area {
        max-width: 360px;
        width: 100%;
      }
      .extras {
        max-width: 360px;
        width: 100%;
        margin-top: 8px;
      }
      .footer {
        max-width: 360px;
        width: 100%;
        border-top: 1px solid #003333;
        padding-top: 12px;
        margin-top: 24px;
      }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- FIGURE — full composition (logo + reaper) -->
  <div class="figure-wrap">
    <img src="/static/login_mobile.JPEG" alt="Twin Shadow">
  </div>

  <!-- FORM COL (right panel on desktop, inline on mobile) -->
  <div class="form-col">

    <!-- FORM -->
    <form class="form-area" method="POST" action="/login">

      <!-- USERNAME -->
      <div class="field-wrap">
        <input class="field-input" type="text" name="username" placeholder="USERNAME" autocomplete="username" autofocus value="{{ username_val or '' }}">
        <span class="field-cursor">█</span>
      </div>

      <!-- PASSWORD -->
      <div class="field-wrap">
        <input class="field-input" type="password" name="password" placeholder="PASSWORD" autocomplete="current-password">
        <span class="field-cursor">█</span>
      </div>

      <!-- REMEMBER ME inside form so it submits -->
      <label class="remember-row" style="margin-top:2px">
        <input type="checkbox" name="remember"> Remember Me
      </label>

      {% if error %}
      <div class="err-msg">&#9888; {{ error }}</div>
      {% endif %}

      <button type="submit" class="login-btn">LOGIN</button>
    </form>

    <!-- EXTRAS -->
    <div class="extras">
      <div class="forgot-row">
        New here?&nbsp; <a href="/register">Create New Account</a>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      &copy; 2026 TWIN SHADOW All rights reserved.&nbsp;|&nbsp;
      A:\&gt; DIR&nbsp;
      <a href="#">Privacy Policy</a>&nbsp;|&nbsp;
      <a href="#">Terms of Service</a>&nbsp;|&nbsp;
      <a href="#">Contact</a>
    </div>

  </div><!-- /form-col -->

</div>
</body>
</html>
