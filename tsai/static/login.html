<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Twin Shadow — Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple:      #bb22ff;
      --purple-dim:  #55008a;
      --purple-glow: rgba(180,60,255,0.5);
      --neon-bright: #f2eaff;
      --muted:       #7744aa;
    }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      cursor: crosshair;
    }

    /* Scanlines */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* BBS terminal frame */
    .bbs-frame {
      position: relative;
      z-index: 2;
      width: min(420px, 92vw);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 32px var(--purple-glow);
    }

    /* ╔══[ TOP BAR ]══╗ */
    .frame-top {
      display: flex;
      align-items: center;
      background: #000;
      border: 2px solid var(--purple);
      border-bottom: none;
      padding: 4px 0;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .frame-top-l { color: var(--purple); flex-shrink: 0; padding-left: 8px; text-shadow: 0 0 6px var(--purple); }
    .frame-top-c { flex: 1; text-align: center; color: var(--neon-bright); letter-spacing: 0.15em; text-shadow: 0 0 8px var(--purple); }
    .frame-top-r { color: var(--purple); flex-shrink: 0; padding-right: 8px; text-shadow: 0 0 6px var(--purple); }

    /* frame body */
    .frame-body {
      background: #000;
      border: 2px solid var(--purple);
      border-top: none;
      border-bottom: none;
      padding: 20px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Logo */
    .logo-wrap {
      display: flex; justify-content: center; padding-bottom: 4px;
    }
    .logo-wrap img {
      width: 100px; height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 0 14px var(--purple)) brightness(1.05);
    }

    /* Info line */
    .info-line {
      display: flex;
      justify-content: space-between;
      color: var(--neon-bright);
      font-size: 11px;
      letter-spacing: 0.12em;
      border-bottom: 1px solid var(--purple-dim);
      padding-bottom: 8px;
    }
    .info-line-r { color: var(--purple); }

    .sub { color: var(--muted); font-size: 10px; letter-spacing: 0.08em; }

    input {
      background: #000;
      border: 1px solid var(--purple);
      color: var(--neon-bright);
      font-family: inherit; font-size: 13px;
      padding: 8px 10px;
      width: 100%; outline: none;
      letter-spacing: 2px;
      caret-color: var(--purple);
      transition: box-shadow .15s;
    }
    input::placeholder { color: var(--purple-dim); letter-spacing: 1px; }
    input:focus { box-shadow: 0 0 10px var(--purple-glow); border-color: var(--purple); }

    .err { color: #ff44aa; font-size: 10px; letter-spacing: 0.08em; }

    /* ╠─── SEPARATOR ─── ╣ */
    .bbs-sep {
      display: flex; align-items: center;
      color: var(--purple);
      font-size: 13px; height: 14px;
      text-shadow: 0 0 6px var(--purple);
    }
    .bbs-sep::before { content: '╠'; flex-shrink: 0; }
    .bbs-sep::after  { content: '╣'; flex-shrink: 0; }
    .bbs-sep-line { flex: 1; border-top: 1px solid var(--purple); }

    /* input area */
    .input-area {
      background: #000;
      border: 2px solid var(--purple);
      border-top: none;
      border-bottom: none;
      padding: 8px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      background: #000;
      color: var(--neon-bright);
      border: 1px solid var(--purple);
      font-family: inherit; font-size: 11px;
      padding: 9px;
      cursor: pointer; width: 100%;
      letter-spacing: 2px;
      transition: background .15s, box-shadow .15s;
      text-shadow: 0 0 6px var(--purple);
    }
    button:hover {
      background: rgba(100,0,160,0.5);
      box-shadow: 0 0 14px var(--purple-glow);
    }

    /* ╚══[ PROMPT ]══╝ */
    .frame-bot {
      display: flex;
      align-items: center;
      background: #000;
      border: 2px solid var(--purple);
      border-top: none;
      padding: 4px 0;
      font-size: 11px;
      box-shadow: 0 0 24px var(--purple-glow);
    }
    .frame-bot-l { color: var(--purple); flex-shrink: 0; padding-left: 8px; text-shadow: 0 0 6px var(--purple); }
    .frame-bot-c { flex: 1; color: var(--muted); letter-spacing: 0.12em; padding: 0 8px; }
    .frame-bot-r { color: var(--purple); flex-shrink: 0; padding-right: 8px; text-shadow: 0 0 6px var(--purple); }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor { display: inline-block; width: 7px; height: 11px; background: var(--purple); animation: blink .7s step-end infinite; vertical-align: middle; margin-left: 2px; }
  </style>
</head>
<body>
<div class="bbs-frame">

  <div class="frame-top">
    <span class="frame-top-l">╔══[</span>
    <span class="frame-top-c">── TWIN SHADOW BBS v2.0 ──</span>
    <span class="frame-top-r">]══╗</span>
  </div>

  <div class="frame-body">
    <div class="logo-wrap">
      <img src="/static/send_btn.jpg" alt="Twin Shadow">
    </div>
    <div class="info-line">
      <span>/TWINSHADOW/AUTH.EXE</span>
      <span class="info-line-r">v2.0</span>
    </div>
    <div class="sub">RESTRICTED SYSTEM. AUTHORISED USERS ONLY.</div>
  </div>

  <div class="bbs-sep"><span class="bbs-sep-line"></span></div>

  <div class="input-area">
    <form method="POST" action="/login" style="display:flex;flex-direction:column;gap:10px">
      <input type="password" name="password" placeholder="ENTER ACCESS CODE" autofocus autocomplete="current-password">
      {% if error %}
      <div class="err">&#9888; {{ error }}</div>
      {% endif %}
      <button type="submit">[ AUTHENTICATE ]</button>
    </form>
  </div>

  <div class="frame-bot">
    <span class="frame-bot-l">╚══</span>
    <span class="frame-bot-c">AWAITING INPUT <span class="cursor"></span></span>
    <span class="frame-bot-r">══╝</span>
  </div>

</div>
</body>
</html>
